name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: flink-job/pom.xml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: producers/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile and test the Flink job with the Maven Wrapper
        run: sh ./mvnw --batch-mode --no-transfer-progress -f flink-job/pom.xml clean test package

      - name: Test the Python producer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r producers/requirements.txt
          python -m unittest discover -s producers/tests -p "test_*.py" -v

      - name: Validate versioned JSON with Node.js
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (['.git', 'target', '__pycache__'].includes(entry.name)) continue;
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(file);
              else if (entry.name.endsWith('.json')) {
                let content = fs.readFileSync(file, 'utf8');
                if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
                JSON.parse(content);
              }
            }
          }

          visit('.');
          console.log('JSON versionados validos.');
          NODE

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate the smoke-test PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/Smoke-Test.ps1),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

  smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deterministic end-to-end smoke test
        shell: pwsh
        run: ./scripts/Smoke-Test.ps1 -StartStack -Cleanup -TimeoutSeconds 420
